<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page 2</title>
    <link rel="stylesheet" href="./styles.css?v=sticker20260503" />
    <link rel="stylesheet" href="https://use.typekit.net/qkp4irs.css" />
  </head>
  <body>
    <div class="device-scale-slot">
      <div class="iphone-17-device">
        <div class="iphone-17-rail iphone-17-rail--left" aria-hidden="true"></div>
        <div class="iphone-17-rail iphone-17-rail--right" aria-hidden="true"></div>
        <div class="iphone-17-frame">
          <div class="iphone-17-island" aria-hidden="true"></div>
          <main class="phone page2-screen">
            <div class="p2-layer p2-bg-top"></div>
            <div class="p2-layer p2-bg-bottom"></div>
            <img class="p2-layer p2-star-main" src="./assets/starlightblue.png" width="83" height="83" alt="" aria-hidden="true" />
            <img class="p2-layer p2-star-small" src="./assets/starblue.png" width="110" height="108" alt="" aria-hidden="true" />
            <div class="p2-headline-wrap" aria-label="Sticker Collection">
              <p class="p2-title p2-title-sticker">Sticker</p>
              <p class="p2-title p2-title-collection">Collection</p>
            </div>

            <section class="p2-card" aria-label="Sticker achievement">
              <p class="p2-card-heading" id="p2-greeting">Good Evening</p>
              <p class="p2-card-mia">Mia!</p>
              <img
                class="p2-card-star"
                id="p2-card-star"
                src="./assets/star-rainbow-card.png"
                alt=""
              />
              <img class="p2-card-sparkle p2-card-sparkle--a" src="./assets/sparkle1.png" alt="" aria-hidden="true" />
              <img class="p2-card-sparkle p2-card-sparkle--b" src="./assets/sparkle2.png" alt="" aria-hidden="true" />
            </section>
            <img
              class="p2-layer p2-card-edit"
              src="./assets/edit-symbol.png"
              width="64"
              height="64"
              alt=""
              aria-hidden="true"
            />
            <button class="p2-card-edit-trigger" id="p2-card-edit-trigger" type="button" aria-label="Choose your star"></button>

            <img
              class="p2-grid-sticker"
              src="./assets/sticker-collection-hello.png"
              alt="Hello my name is Mia sticker"
            />
            <button
              class="p2-sticker-trigger p2-sticker-trigger--hello"
              type="button"
              data-sticker-title="Hello, My Name Is"
              data-sticker-reason="You earned this sticker by joining the app."
              aria-label="View why you earned the Hello sticker"
            ></button>
            <img
              class="p2-grid-sleepy"
              src="./assets/sticker-collection-sleepy.png"
              alt="Sleepy sipper club sticker"
            />
            <button
              class="p2-sticker-trigger p2-sticker-trigger--sleepy"
              type="button"
              data-sticker-title="Sleepy Sipper Club"
              data-sticker-reason="You earned this sticker by collecting late-night drink moments in your journal."
              aria-label="View why you earned the Sleepy Sipper sticker"
            ></button>
            <div class="p2-grid-box p2-grid-box-a"></div>
            <div class="p2-grid-box p2-grid-box-b"></div>
            <div class="p2-grid-box p2-grid-box-c"></div>
            <div class="p2-grid-box p2-grid-box-d"></div>
            <div class="p2-grid-box p2-grid-box-e"></div>
            <div class="p2-grid-box p2-grid-box-f"></div>

            <section class="p2-star-picker" id="p2-star-picker" hidden aria-label="Choose your star">
              <div class="p2-star-picker-panel">
                <button class="p2-star-choice p2-star-choice--pink" type="button" data-star-src="./assets/star-pink.png" aria-label="Choose pink star">
                  <img src="./assets/star-pink.png" alt="" />
                </button>
                <button class="p2-star-choice p2-star-choice--blue" type="button" data-star-src="./assets/star-blue.png" aria-label="Choose blue star">
                  <img src="./assets/star-blue.png" alt="" />
                </button>
                <button class="p2-star-choice p2-star-choice--green" type="button" data-star-src="./assets/star-green.png" aria-label="Choose green star">
                  <img src="./assets/star-green.png" alt="" />
                </button>
                <button class="p2-star-choice p2-star-choice--orange" type="button" data-star-src="./assets/star-orange.png" aria-label="Choose orange star">
                  <img src="./assets/star-orange.png" alt="" />
                </button>
                <button class="p2-star-choice p2-star-choice--purple" type="button" data-star-src="./assets/star-purple.png" aria-label="Choose purple star">
                  <img src="./assets/star-purple.png" alt="" />
                </button>
                <button class="p2-star-choice p2-star-choice--rainbow" type="button" data-star-src="./assets/star-rainbow.png" aria-label="Choose rainbow star">
                  <img src="./assets/star-rainbow.png" alt="" />
                </button>
              </div>
            </section>
            <section class="p2-sticker-modal" id="p2-sticker-modal" hidden role="dialog" aria-modal="true" aria-labelledby="p2-sticker-modal-title">
              <div class="p2-sticker-modal-card">
                <h3 class="p2-sticker-modal-title" id="p2-sticker-modal-title">Sticker</h3>
                <p class="p2-sticker-modal-copy" id="p2-sticker-modal-copy">You earned this sticker!</p>
              </div>
            </section>
          </main>
      <div class="phone-tab-strip" role="navigation" aria-label="Main">
            <div class="p2-menu-bar"></div>
            <img
              class="p2-nav-figma p2-nav-figma--home-outline"
              src="./assets/nav-home-icon.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sticker"
              src="./assets/nav-sticker.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sip-cup"
              src="./assets/nav-sip-cup.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sip-handle"
              src="./assets/nav-sip-handle.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sip-steam p2-nav-figma--sip-steam-l"
              src="./assets/nav-sip-steam-l.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sip-steam p2-nav-figma--sip-steam-c"
              src="./assets/nav-sip-steam-c.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--sip-steam p2-nav-figma--sip-steam-r"
              src="./assets/nav-sip-steam-r.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p2-nav-figma p2-nav-figma--profile"
              src="./assets/nav-profile.png"
              alt=""
              aria-hidden="true"
            />
            <a
              class="p2-home-hit"
              href="./index.html"
              aria-label="Go to home"
              onclick="sessionStorage.setItem('drinkindexSkipSplashOnce','true')"
            ></a>
            <a class="p2-star-hit" href="./stickercollection.html" aria-current="page" aria-label="Current page: sticker collection"></a>
            <a
              class="p2-page3-hit"
              href="./drinkoptions.html"
              aria-label="Go to page 3"
              onclick="sessionStorage.setItem('drinkLocationPromptPending', 'true')"
            ></a>
            <a class="p2-profile-hit" href="./profile.html" aria-label="Go to journal"></a>
            <span class="p2-nav-label p2-nav-label--home" aria-hidden="true">Home</span>
            <span class="p2-nav-label p2-nav-label--stickers" aria-hidden="true">Stickers</span>
            <span class="p2-nav-label p2-nav-label--sips" aria-hidden="true">Sips</span>
            <span class="p2-nav-label p2-nav-label--profile" aria-hidden="true">Journal</span>
      </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const greeting = document.getElementById("p2-greeting");
        const editTrigger = document.getElementById("p2-card-edit-trigger");
        const picker = document.getElementById("p2-star-picker");
        const cardStar = document.getElementById("p2-card-star");
        const stickerModal = document.getElementById("p2-sticker-modal");
        const stickerModalTitle = document.getElementById("p2-sticker-modal-title");
        const stickerModalCopy = document.getElementById("p2-sticker-modal-copy");
        const stickerTriggers = Array.from(document.querySelectorAll(".p2-sticker-trigger"));
        const page = document.querySelector(".page2-screen");
        if (!greeting || !editTrigger || !picker || !cardStar || !stickerModal || !stickerModalTitle || !stickerModalCopy || !page || !stickerTriggers.length) return;

        const hour = new Date().getHours();
        if (hour < 12) {
          greeting.textContent = "Good Morning";
        } else if (hour < 18) {
          greeting.textContent = "Good Afternoon";
        } else {
          greeting.textContent = "Good Evening";
        }

        function openPicker() {
          picker.hidden = false;
        }

        function closePicker() {
          picker.hidden = true;
        }

        function openStickerModal(title, reason) {
          stickerModalTitle.textContent = title || "Sticker";
          stickerModalCopy.textContent = reason || "You earned this sticker!";
          stickerModal.hidden = false;
          page.classList.add("is-sticker-modal-open");
        }

        function closeStickerModal() {
          stickerModal.hidden = true;
          page.classList.remove("is-sticker-modal-open");
        }

        editTrigger.addEventListener("click", openPicker);
        picker.addEventListener("click", function (event) {
          if (event.target === picker) closePicker();
        });

        picker.querySelectorAll("[data-star-src]").forEach(function (option) {
          option.addEventListener("click", function () {
            const nextSrc = option.getAttribute("data-star-src");
            if (nextSrc) cardStar.setAttribute("src", nextSrc);
            closePicker();
          });
        });

        stickerTriggers.forEach(function (trigger) {
          trigger.addEventListener("click", function () {
            openStickerModal(trigger.getAttribute("data-sticker-title"), trigger.getAttribute("data-sticker-reason"));
          });
        });

        stickerModal.addEventListener("click", function (event) {
          if (event.target === stickerModal) closeStickerModal();
        });
      })();
    </script>
  </body>
</html>
