<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page 3</title>
    <link rel="stylesheet" href="./styles.css?v=polaroid30" />
    <link rel="stylesheet" href="https://use.typekit.net/qkp4irs.css" />
  </head>
  <body>
    <div class="device-scale-slot">
      <div class="iphone-17-device">
        <div class="iphone-17-rail iphone-17-rail--left" aria-hidden="true"></div>
        <div class="iphone-17-rail iphone-17-rail--right" aria-hidden="true"></div>
        <div class="iphone-17-frame">
          <div class="iphone-17-island" aria-hidden="true"></div>
          <main class="phone p3-screen" id="p3-screen" aria-label="Drink options screen">
            <div class="p3-content">
              <div class="p3-header-bar" aria-hidden="true"></div>
              <p class="p3-headline p3-headline-drink">Drink</p>
              <p class="p3-headline p3-headline-menu">Menu</p>
              <img class="p3-header-star p3-header-star--a" src="./assets/starlightblue.png" width="83" height="83" alt="" aria-hidden="true" />
              <img class="p3-header-star p3-header-star--b" src="./assets/starblue.png" width="110" height="108" alt="" aria-hidden="true" />
              <div class="p3-board"></div>
              <img class="p3-mug p3-mug-pink p3-mug-option" data-mug="pink" src="./assets/mug-pink.png" alt="Choose pink drink" />
              <img class="p3-mug p3-mug-green p3-mug-option" data-mug="green" src="./assets/mug-green.png" alt="Choose green drink" />
              <img class="p3-mug p3-mug-blue p3-mug-option" data-mug="blue" src="./assets/mug-blue.png" alt="Choose blue drink" />
              <img class="p3-mug p3-mug-purple p3-mug-option" data-mug="purple" src="./assets/mug-purple.png" alt="Choose purple drink" />
              <img class="p3-mug p3-mug-orange p3-mug-option" data-mug="orange" src="./assets/orangemug.png" alt="Choose other drink" />
              <img class="p3-mug-picker-chip" src="./assets/mainstar.png" alt="" aria-hidden="true" />
              <button class="p3-mug-picker-go" id="p3-mug-picker-go" type="button" aria-label="Find places for selected drinks">
                <svg class="p3-mug-picker-go-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                  <circle cx="20" cy="20" r="15.25" stroke="currentColor" stroke-width="2.35" />
                  <path
                    d="M16 12.25 L26.5 20 L16 27.75"
                    stroke="currentColor"
                    stroke-width="2.35"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    fill="none"
                  />
                </svg>
              </button>
            </div>

            <section class="p3-permission-modal" id="p3-permission-modal" role="dialog" aria-modal="true" aria-label="Location permission request">
              <div class="p3-permission-card">
                <header class="p3-permission-header">
                  <h2>Allow “StarSips” to use your location?</h2>
                  <p>Location access is required to find fun drinks near you.</p>
                </header>
                <div class="p3-permission-map"></div>
                <button class="p3-permission-action" id="p3-allow-once" type="button">Allow Once</button>
                <button class="p3-permission-action" id="p3-allow-while-using" type="button">Allow While Using App</button>
                <button class="p3-permission-action" id="p3-dont-allow" type="button">Don’t Allow</button>
              </div>
            </section>
      <div class="phone-tab-strip" role="navigation" aria-label="Main">
            <div class="p3-menu-bar"></div>
            <div class="phone-tab-strip-inner">
            <img
              class="p3-nav-figma p3-nav-figma--home-outline"
              src="./assets/nav-home-icon.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sticker"
              src="./assets/nav-sticker.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sip-cup"
              src="./assets/nav-sip-cup.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sip-handle"
              src="./assets/nav-sip-handle.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sip-steam p3-nav-figma--sip-steam-l"
              src="./assets/nav-sip-steam-l.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sip-steam p3-nav-figma--sip-steam-c"
              src="./assets/nav-sip-steam-c.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--sip-steam p3-nav-figma--sip-steam-r"
              src="./assets/nav-sip-steam-r.png"
              alt=""
              aria-hidden="true"
            />
            <img
              class="p3-nav-figma p3-nav-figma--profile"
              src="./assets/nav-profile.png"
              alt=""
              aria-hidden="true"
            />
            <a
              class="p3-home-hit"
              href="./index.html"
              aria-label="Go to home"
              onclick="sessionStorage.setItem('drinkindexSkipSplashOnce','true')"
            ></a>
            <a class="p3-star-hit" href="./stickercollection.html" aria-label="Go to sticker collection"></a>
            <a class="p3-page3-hit" href="./drinkoptions.html" aria-current="page" aria-label="Current page: drink options"></a>
            <a class="p3-profile-hit" href="./profile.html" aria-label="Go to journal"></a>
            <span class="p3-nav-label p3-nav-label--home" aria-hidden="true">Home</span>
            <span class="p3-nav-label p3-nav-label--stickers" aria-hidden="true">Stickers</span>
            <span class="p3-nav-label p3-nav-label--sips" aria-hidden="true">Sips</span>
            <span class="p3-nav-label p3-nav-label--profile" aria-hidden="true">Journal</span>
            </div>
      </div>
          </main>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const screen = document.getElementById("p3-screen");
        const modal = document.getElementById("p3-permission-modal");
        const mugOptions = Array.from(document.querySelectorAll(".p3-mug-option"));
        const mugPickerGo = document.getElementById("p3-mug-picker-go");
        const allowOnce = document.getElementById("p3-allow-once");
        const allowWhileUsing = document.getElementById("p3-allow-while-using");
        const dontAllow = document.getElementById("p3-dont-allow");
        if (!screen || !modal || !allowOnce || !allowWhileUsing || !dontAllow || !mugPickerGo) return;

        const pendingKey = "drinkLocationPromptPending";
        const coordsKey = "drinkindexCoords";
        const selectedMugsKey = "drinkindexSelectedMugs";
        const shouldShow = sessionStorage.getItem(pendingKey) === "true";

        if (shouldShow) {
          screen.classList.add("is-permission-open");
          modal.hidden = false;
        } else {
          modal.hidden = true;
        }

        function closeModal() {
          screen.classList.remove("is-permission-open");
          modal.hidden = true;
          sessionStorage.removeItem(pendingKey);
        }

        function saveCoords(position) {
          const payload = {
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            capturedAt: Date.now()
          };
          sessionStorage.setItem(coordsKey, JSON.stringify(payload));
        }

        function requestLocationThenClose() {
          if (!("geolocation" in navigator)) {
            closeModal();
            return;
          }
          navigator.geolocation.getCurrentPosition(
            function (position) {
              saveCoords(position);
              closeModal();
            },
            function () {
              closeModal();
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 300000
            }
          );
        }

        allowOnce.addEventListener("click", function () {
          requestLocationThenClose();
        });

        allowWhileUsing.addEventListener("click", function () {
          requestLocationThenClose();
        });

        dontAllow.addEventListener("click", function () {
          closeModal();
        });

        const selectedMugs = new Set();

        function syncMugUi() {
          mugOptions.forEach(function (mug) {
            const key = mug.getAttribute("data-mug");
            if (!key) return;
            mug.classList.toggle("is-selected", selectedMugs.has(key));
          });
          mugPickerGo.classList.toggle("is-disabled", selectedMugs.size === 0);
          mugPickerGo.disabled = selectedMugs.size === 0;
        }

        mugOptions.forEach(function (mug) {
          mug.addEventListener("click", function () {
            const mugKey = mug.getAttribute("data-mug");
            if (!mugKey) return;
            if (selectedMugs.has(mugKey)) {
              selectedMugs.delete(mugKey);
            } else {
              selectedMugs.add(mugKey);
            }
            syncMugUi();
          });
        });

        mugPickerGo.addEventListener("click", function () {
          const list = Array.from(selectedMugs);
          if (!list.length) return;
          sessionStorage.setItem(selectedMugsKey, JSON.stringify(list));
          window.location.href = "./drinkfinder.html?mugs=" + encodeURIComponent(list.join(","));
        });

        syncMugUi();
      })();
    </script>
  </body>
</html>
